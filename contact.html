<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Contact Us | abdallah law firm</title>
        <meta name="description" content="Contact abdallah law firm in Port Louis.">
        <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script defer src="js/main.js"></script>
    </head>
    <body>
        <a class="skip" href="#main">Skip to content</a>
        <div id="site-header"></div><main id="main">
            <section><div class="wrap"><h1>Contact us</h1>
                <div class="grid">
                    <form id="cf" novalidate>
<div><label for="name">Full name</label>
    <input id="name" autocomplete="name">
    <div class="err" id="e-name" role="alert"></div>
</div>

<div><label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <div class="err" id="e-email" role="alert"></div>
</div>

<div><label for="phone">Phone</label>
    <input id="phone" type="tel" autocomplete="tel">
    <div class="err" id="e-phone" role="alert"></div>
</div>

<div><label for="area">Practice area</label>
    <select id="area"><option value="">Choose…</option>
        <option>Family Law</option>
        <option>Criminal Law</option>
        <option>Labour/Employment Law</option>
        <option>Tenancy and Rental Law</option>
        <option>Commercial Law</option>
        <option>Contractual Disputes</option>
        <option>Litigation and Arbitration</option>
        <option>Mediation</option>
        <option>Contract Drafting</option>
    </select><div class="err" id="e-area" role="alert"></div>
</div>

<div><label for="msg">Message</label>
    <textarea id="msg" rows="5"></textarea>
    <div class="err" id="e-msg" role="alert"></div>
</div>

<div><label><input type="checkbox" id="consent" style="width:auto"> I consent to being contacted about my enquiry.</label>
    <div class="err" id="e-consent" role="alert"></div>
</div>

<button class="btn" type="submit">Send message</button>
<div class="ok" id="ok" tabindex="-1" role="status">Message sent. We will reply within two working days.</div>
</form>

<div><p><b>Address:</b> 1 Example Street, Port Louis<br><b>Phone:</b> 
    <a href="tel:+23057995620">+230 57995620</a><br>
    <b>Email:</b> <a href="mailto:abdallah@gmail.com">abdallah@gmail.com</a></p>
    <div class="map"></div>
</div>
</div>
</div>
</section>
</main>
<div id="site-footer"></div>
</body>
</html>
